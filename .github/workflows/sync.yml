name: sync
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch page
        run: |
          set -e
          curl -sSL -o index.html 'https://site-297985b8da9e424b909cc6f2f05cc644.freebuff.page'
          test -s index.html
          grep -q '<title>' index.html
          if ! grep -q 'noindex' index.html; then
            sed -i 's|<head>|<head><meta name="robots" content="noindex, nofollow">|' index.html
          fi
          wc -c index.html
      - name: commit
        run: |
          set -e
          git config user.name 'page sync'
          git config user.email 'sync@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'sync page [skip ci]'
          git push
