<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf4ec">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>un lugar tranquilo</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(95% 60% at 50% 112%, #f3d8c6 0%, rgba(243,216,198,0) 64%), #fdf4ec;
    color: #8b736a;
    font: 400 16px/1.6 ui-sans-serif, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  body { display: grid; place-items: center; text-align: center; padding: 24px; }
  .box { max-width: 30ch; }
  .dot {
    width: 10px; height: 10px; border-radius: 50%; background: #e2a184;
    margin: 0 auto 18px; animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: .3; transform: scale(.85); } 50% { opacity: 1; transform: scale(1); } }
  p { margin: .4em 0; }
</style>
</head>
<body>
<div class="box">
  <div class="dot" id="dot"></div>
  <p id="msg">abriendo…</p>
</div>
<script>
(function () {
  var msg = document.getElementById("msg");
  var dot = document.getElementById("dot");
  function fail(text) {
    dot.style.animation = "none";
    dot.style.opacity = ".3";
    msg.textContent = text;
  }
  function b64(str) {
    str = str.replace(/-/g, "+").replace(/_/g, "/");
    while (str.length % 4) str += "=";
    var bin = atob(str);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  var m = location.hash.match(/[#&]k=([A-Za-z0-9_-]+)/);
  var key64 = m ? m[1] : null;
  try {
    if (key64) localStorage.setItem("calma-key", key64);
    else key64 = localStorage.getItem("calma-key");
  } catch (e) {}
  if (!key64) { fail("este enlace está incompleto \u2014 pídelo otra vez."); return; }
  if (!(window.crypto && crypto.subtle)) { fail("este navegador no puede abrir la página."); return; }

  fetch("payload.bin")
    .then(function (r) { if (!r.ok) throw new Error("payload"); return r.text(); })
    .then(function (txt) {
      var raw = b64(txt.trim());
      var iv = raw.slice(0, 12);
      var data = raw.slice(12);
      return crypto.subtle
        .importKey("raw", b64(key64), { name: "AES-GCM" }, false, ["decrypt"])
        .then(function (k) { return crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, k, data); });
    })
    .then(function (buf) {
      var out = new TextDecoder().decode(buf);
      document.open();
      document.write(out);
      document.close();
    })
    .catch(function () {
      fail("no se pudo abrir. revisa tu conexión e intenta otra vez.");
    });
})();
</script>
</body>
</html>
