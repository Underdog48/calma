<!DOCTYPE html>
<html lang="es">
<head><meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fdf4ec">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="tranquilo">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<title>un lugar tranquilo</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }

  :root {
    --ink: #3f2f2a;
    --muted: #8b736a;
    --accent: #c26450;
    --accent-2: #e2a184;
    --card: #fffcf9;
    --line: #f0dccd;
    --shadow: 0 20px 45px -26px rgba(96, 55, 40, .42);
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
  }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100dvh;
    color: var(--ink);
    font: 400 16px/1.6 ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    background:
      radial-gradient(80% 60% at 6% 0%, #fff8f2 0%, rgba(255, 248, 242, 0) 60%),
      radial-gradient(70% 55% at 100% 6%, #fbe2d1 0%, rgba(251, 226, 209, 0) 58%),
      radial-gradient(95% 60% at 50% 112%, #f3d8c6 0%, rgba(243, 216, 198, 0) 64%),
      #fdf4ec;
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .glow {
    position: fixed;
    z-index: 0;
    border-radius: 50%;
    pointer-events: none;
    filter: blur(70px);
    opacity: .55;
  }
  .glow.a {
    width: 46vmin; height: 46vmin;
    top: -12vmin; left: -10vmin;
    background: #ffd3b6;
    animation: drift 26s ease-in-out infinite;
  }
  .glow.b {
    width: 52vmin; height: 52vmin;
    bottom: -18vmin; right: -14vmin;
    background: #f7c4b4;
    opacity: .42;
    animation: drift 34s ease-in-out infinite reverse;
  }
  @keyframes drift {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(4vmin, 5vmin) scale(1.08); }
  }

  .shell {
    position: relative;
    z-index: 1;
    max-width: 680px;
    margin: 0 auto;
    padding: max(18px, env(safe-area-inset-top)) clamp(16px, 4.5vw, 24px) 56px;
  }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
    padding: 4px 0 2px;
  }

  .lang {
    display: flex;
    gap: 4px;
    padding: 3px;
    border-radius: 999px;
    background: rgba(255, 255, 255, .55);
    border: 1px solid rgba(255, 255, 255, .8);
    backdrop-filter: blur(6px);
  }
  .lang button {
    appearance: none;
    border: 0;
    background: none;
    color: var(--muted);
    font: inherit;
    font-size: .7rem;
    letter-spacing: .12em;
    padding: 5px 11px;
    border-radius: 999px;
    cursor: pointer;
    transition: background .25s, color .25s;
  }
  .lang button[aria-pressed="true"] {
    background: var(--accent);
    color: #fff8f3;
  }

  .snd {
    width: 34px;
    height: 34px;
    padding: 0;
    display: grid;
    place-items: center;
    border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, .8);
    background: rgba(255, 255, 255, .55);
    color: var(--muted);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: color .2s, background .2s;
  }
  .snd:hover { background: rgba(255, 255, 255, .85); }
  .snd .off { display: none; }
  .snd[aria-pressed="false"] .on { display: none; }
  .snd[aria-pressed="false"] .off { display: block; }
  .snd[aria-pressed="false"] { color: #c2a89e; }

  .head { padding: 6px 2px 2px; }
  .head h1 {
    margin: 0;
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(2rem, 7vw, 2.7rem);
    line-height: 1.08;
    letter-spacing: -.015em;
  }
  .head h1 .nm { color: var(--accent); font-style: italic; }
  .head .sub {
    margin: .55rem 0 0;
    font-size: clamp(.95rem, 2.6vw, 1.02rem);
    color: var(--muted);
    max-width: 34ch;
  }

  .tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    margin: 20px 0 18px;
  }
  .tabs button {
    appearance: none;
    font: inherit;
    font-size: .88rem;
    color: var(--muted);
    padding: 9px 15px;
    border-radius: 999px;
    border: 1px solid rgba(255, 255, 255, .9);
    background: rgba(255, 255, 255, .58);
    cursor: pointer;
    transition: background .22s, color .22s, transform .18s, border-color .22s;
    -webkit-tap-highlight-color: transparent;
  }
  .tabs button:hover { background: rgba(255, 255, 255, .9); }
  .tabs button:active { transform: scale(.96); }
  .tabs button.on {
    background: var(--accent);
    border-color: transparent;
    color: #fff8f3;
    box-shadow: 0 10px 22px -14px rgba(150, 60, 40, .9);
  }

  .panel { display: none; }
  .panel.on { display: block; animation: rise .5s cubic-bezier(.2, .7, .3, 1) both; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }

  .card {
    background: var(--card);
    border: 1px solid rgba(255, 255, 255, .95);
    border-radius: 26px;
    padding: clamp(20px, 5vw, 34px);
    box-shadow: var(--shadow);
  }

  /* ---------- letter ---------- */
  .letter p {
    margin: 0 0 1.1em;
    font-family: var(--serif);
    font-size: clamp(1.06rem, 2.9vw, 1.16rem);
    line-height: 1.85;
  }
  .letter p:last-of-type { margin-bottom: 0; }
  .sign {
    margin-top: 1.5rem;
    font-family: var(--serif);
    font-style: italic;
    color: var(--accent);
    font-size: 1.02rem;
  }

  /* ---------- breathe ---------- */
  .breathe {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 6px;
  }
  .orb-wrap {
    display: grid;
    place-items: center;
    width: min(66vw, 240px);
    aspect-ratio: 1;
    margin: 6px 0 10px;
  }
  .orb {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 50%;
    display: grid;
    place-items: center;
    transform: scale(.66);
    transition: transform 4s cubic-bezier(.42, 0, .42, 1);
    background:
      radial-gradient(circle at 36% 30%, #fff6ee 0%, #ffd9c4 38%, #eda98a 72%, #dd8b6d 100%);
    box-shadow:
      0 0 60px -6px rgba(228, 152, 122, .55),
      inset 0 -10px 26px rgba(176, 96, 70, .18);
  }
  .orb::after {
    content: "";
    position: absolute;
    inset: -14%;
    border-radius: 50%;
    border: 1px solid rgba(226, 161, 132, .35);
    opacity: .9;
  }
  .orb .count {
    font-family: var(--serif);
    font-size: clamp(1.5rem, 5vw, 1.9rem);
    color: #7a3b2a;
    opacity: .82;
  }
  .phase {
    margin: 0;
    font-family: var(--serif);
    font-size: clamp(1.18rem, 3.5vw, 1.4rem);
    min-height: 1.6em;
    letter-spacing: .01em;
  }
  .rounds { margin: 0; font-size: .8rem; color: var(--muted); letter-spacing: .04em; }

  button.big {
    appearance: none;
    font: inherit;
    font-size: .98rem;
    padding: 13px 30px;
    margin-top: 12px;
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: #fff8f3;
    cursor: pointer;
    box-shadow: 0 14px 26px -14px rgba(160, 70, 45, .85);
    transition: transform .16s, filter .2s;
    -webkit-tap-highlight-color: transparent;
  }
  button.big:hover { filter: brightness(1.05); }
  button.big:active { transform: scale(.97); }
  button.big.ghost {
    background: rgba(194, 100, 80, .09);
    color: var(--accent);
    box-shadow: none;
  }

  .hint {
    margin: 14px 0 0;
    font-size: .84rem;
    color: var(--muted);
    text-align: center;
    line-height: 1.6;
  }

  /* ---------- pop ---------- */
  .pop-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .pop-count {
    font-family: var(--serif);
    font-size: 1.05rem;
    color: var(--accent);
  }
  .pop-count .total { color: var(--muted); font-size: .85rem; }
  .bubbles {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(44px, 1fr));
    gap: 9px;
    touch-action: manipulation;
  }
  .bubble {
    appearance: none;
    padding: 0;
    aspect-ratio: 1;
    border: 0;
    border-radius: 50%;
    cursor: pointer;
    background: radial-gradient(circle at 34% 28%, #fffaf6 0%, #ffd8c4 34%, #e99e80 74%, #d2846a 100%);
    box-shadow: inset 0 -2px 7px rgba(150, 70, 45, .22), 0 4px 9px -4px rgba(150, 85, 60, .35);
    transition: transform .13s ease, opacity .3s;
    -webkit-tap-highlight-color: transparent;
  }
  .bubble:active { transform: scale(.87); }
  .bubble.popped {
    pointer-events: none;
    background: #f3e0d3;
    box-shadow: inset 0 1px 3px rgba(140, 90, 70, .14);
    animation: burst .36s cubic-bezier(.2, .8, .3, 1) forwards;
  }
  @keyframes burst {
    0%   { transform: scale(1); opacity: 1; }
    35%  { transform: scale(1.22); opacity: 1; box-shadow: 0 0 0 9px rgba(226, 154, 128, .26); }
    100% { transform: scale(.74); opacity: .55; box-shadow: 0 0 0 0 rgba(226, 154, 128, 0); }
  }
  .pop-done {
    margin: 16px 0 0;
    text-align: center;
    font-family: var(--serif);
    font-size: 1.05rem;
    color: var(--accent);
    opacity: 0;
    transition: opacity .5s;
  }
  .pop-done.show { opacity: 1; }

  /* ---------- vent ---------- */
  .ventbox { position: relative; margin-top: 4px; }
  textarea {
    display: block;
    width: 100%;
    min-height: 150px;
    padding: 16px 18px;
    font: inherit;
    font-size: 1rem;
    line-height: 1.65;
    color: var(--ink);
    background: #fffdfb;
    border: 1px solid var(--line);
    border-radius: 18px;
    resize: vertical;
    outline: none;
    transition: border-color .25s, box-shadow .25s;
  }
  textarea::placeholder { color: #bda79d; }
  textarea:focus {
    border-color: rgba(194, 100, 80, .55);
    box-shadow: 0 0 0 4px rgba(194, 100, 80, .1);
  }
  textarea.hidden { opacity: 0; }

  .dissolve {
    position: absolute;
    inset: 0;
    padding: 16px 18px;
    font-size: 1rem;
    line-height: 1.65;
    overflow: hidden;
    pointer-events: none;
    border-radius: 18px;
    color: var(--ink);
  }
  .dissolve span {
    display: inline-block;
    animation: drift-away 1.1s ease forwards;
    animation-delay: var(--dl, 0s);
  }
  @keyframes drift-away {
    0%   { opacity: 1; filter: blur(0); transform: translateY(0) scale(1); }
    100% { opacity: 0; filter: blur(7px); transform: translateY(-20px) scale(1.06); }
  }

  .gone {
    margin: 16px 0 0;
    text-align: center;
    font-family: var(--serif);
    font-style: italic;
    font-size: 1.1rem;
    color: var(--accent);
    opacity: 0;
    transform: translateY(6px);
    transition: opacity .7s, transform .7s;
  }
  .gone.show { opacity: 1; transform: none; }

  /* ---------- ground ---------- */
  .steps { display: grid; gap: 9px; margin-top: 4px; }
  .step {
    appearance: none;
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    text-align: left;
    font: inherit;
    color: var(--ink);
    padding: 12px 16px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: #fffdfb;
    cursor: pointer;
    transition: background .28s, border-color .28s, transform .16s, color .28s;
    -webkit-tap-highlight-color: transparent;
  }
  .step:active { transform: scale(.985); }
  .step .n {
    flex: 0 0 auto;
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    border-radius: 50%;
    font-family: var(--serif);
    font-size: 1rem;
    color: var(--accent);
    background: rgba(194, 100, 80, .1);
    transition: background .28s, color .28s;
  }
  .step .lbl { font-size: .96rem; line-height: 1.4; }
  .step.done {
    background: #fdf3ec;
    border-color: rgba(226, 161, 132, .45);
  }
  .step.done .n { background: var(--accent); color: #fff8f3; }
  .step.done .lbl { color: var(--muted); }

  /* ---------- games ---------- */
  .subtabs {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin: -2px 0 16px;
  }
  .subtabs button {
    appearance: none;
    font: inherit;
    font-size: .82rem;
    padding: 7px 14px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: #fffdfb;
    color: var(--muted);
    cursor: pointer;
    transition: background .22s, color .22s, border-color .22s, transform .16s;
    -webkit-tap-highlight-color: transparent;
  }
  .subtabs button:active { transform: scale(.96); }
  .subtabs button.on {
    background: rgba(194, 100, 80, .12);
    border-color: rgba(194, 100, 80, .35);
    color: var(--accent);
  }
  .game { display: none; }
  .game.on { display: block; animation: rise .4s cubic-bezier(.2, .7, .3, 1) both; }

  .surf {
    display: block;
    width: 100%;
    height: min(58vw, 300px);
    border-radius: 18px;
    background: #fffdfb;
    border: 1px solid var(--line);
    touch-action: none;
    cursor: crosshair;
  }

  .sky {
    position: relative;
    height: min(62vw, 320px);
    border-radius: 18px;
    border: 1px solid var(--line);
    background: radial-gradient(120% 100% at 50% 0%, #fff8f2 0%, #fbeadd 58%, #f6ddcd 100%);
    overflow: hidden;
    touch-action: manipulation;
  }
  .catch-count {
    position: absolute;
    top: 10px;
    right: 14px;
    font-family: var(--serif);
    font-size: 1.05rem;
    color: var(--accent);
    opacity: .85;
    pointer-events: none;
  }
  .light {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 34%, #fffdf8 0%, #ffdcbc 42%, #e9a179 100%);
    box-shadow: 0 0 20px 3px rgba(233, 161, 121, .42);
    cursor: pointer;
    animation: float 6s linear forwards;
    -webkit-tap-highlight-color: transparent;
  }
  .light.caught {
    animation: snap .3s ease-out forwards;
    pointer-events: none;
  }
  @keyframes float {
    0%   { transform: scale(.7); opacity: 0; }
    14%  { opacity: 1; }
    68%  { opacity: 1; }
    100% { transform: translateY(-74px) scale(1.08); opacity: 0; }
  }
  @keyframes snap {
    0%   { transform: scale(1); opacity: 1; }
    100% { transform: scale(2); opacity: 0; }
  }

  /* ---------- confetti ---------- */
  .pads {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .pad {
    appearance: none;
    padding: 0;
    aspect-ratio: 1;
    border: 1px solid rgba(255, 255, 255, .9);
    border-radius: 18px;
    cursor: pointer;
    box-shadow: inset 0 -3px 8px rgba(140, 90, 70, .12), 0 6px 14px -8px rgba(120, 70, 50, .45);
    transition: transform .12s ease, filter .2s;
    -webkit-tap-highlight-color: transparent;
  }
  .pad:active { transform: scale(.93); }
  .pad.lit { animation: padlit .45s ease-out; }
  @keyframes padlit {
    0%   { transform: scale(.9); filter: brightness(1.3); }
    100% { transform: scale(1); filter: brightness(1); }
  }

  /* ---------- blob ---------- */
  .blobbox {
    position: relative;
    display: grid;
    place-items: center;
    height: min(58vw, 300px);
    border-radius: 18px;
    border: 1px solid var(--line);
    background: radial-gradient(120% 100% at 50% 10%, #fff8f2 0%, #fbeadd 62%, #f6ddcd 100%);
    overflow: hidden;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  .blob {
    position: relative;
    width: 132px;
    height: 118px;
    border-radius: 46% 46% 44% 44% / 52% 52% 48% 48%;
    background: radial-gradient(circle at 38% 30%, #fff7f0 0%, #ffcfae 58%, #e79b78 100%);
    box-shadow: inset -7px -9px 20px rgba(180, 100, 70, .18), 0 16px 26px -16px rgba(150, 90, 60, .55);
    transition: transform .16s;
  }
  .blob.hop { animation: hop .55s cubic-bezier(.2, .8, .3, 1); }
  @keyframes hop {
    0%   { transform: translateY(0) scale(1, 1); }
    22%  { transform: translateY(-28px) scale(.92, 1.09); }
    52%  { transform: translateY(0) scale(1.13, .87); }
    74%  { transform: translateY(-11px) scale(.98, 1.02); }
    100% { transform: translateY(0) scale(1, 1); }
  }
  .eye {
    position: absolute;
    top: 34%;
    width: 20px;
    height: 22px;
    border-radius: 50%;
    background: #fffaf6;
    box-shadow: inset 0 1px 3px rgba(120, 70, 50, .18);
    display: grid;
    place-items: center;
    overflow: hidden;
    animation: blink 6.5s infinite;
  }
  .eye.l { left: 25%; }
  .eye.r { right: 25%; animation-delay: .15s; }
  @keyframes blink {
    0%, 93%, 100% { transform: scaleY(1); }
    96%           { transform: scaleY(.12); }
  }
  .pupil {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: #3f2f2a;
    transition: transform .14s ease-out;
  }
  .mouth {
    position: absolute;
    left: 50%;
    bottom: 24%;
    width: 32px;
    height: 15px;
    margin-left: -16px;
    border-bottom: 3px solid #7a4a38;
    border-radius: 0 0 40px 40px;
  }
  .hearts { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .heart {
    position: absolute;
    font-size: 15px;
    line-height: 1;
    color: #e2685a;
    animation: heartUp 1.15s ease-out forwards;
  }
  @keyframes heartUp {
    0%   { opacity: 0; transform: translateY(0) scale(.5) rotate(-8deg); }
    22%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-78px) scale(1.1) rotate(10deg); }
  }

  /* ---------- now (cool-down timer) ---------- */
  .timer-wrap {
    position: relative;
    width: min(64vw, 226px);
    aspect-ratio: 1;
    margin: 4px auto 0;
    display: grid;
    place-items: center;
  }
  .ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring circle { fill: none; stroke-width: 5; stroke-linecap: round; }
  .ring-bg { stroke: rgba(226, 161, 132, .22); }
  .ring-fg {
    stroke: var(--accent);
    transition: stroke-dashoffset .18s linear, stroke .6s;
  }
  .timer-wrap.done .ring-fg { stroke: #9fb394; }

  .timer-face { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .timer-face .time {
    font-family: var(--serif);
    font-size: clamp(2.15rem, 9vw, 2.85rem);
    line-height: 1;
    color: var(--ink);
    font-variant-numeric: tabular-nums;
    transition: color .6s;
  }
  .timer-wrap.done .timer-face .time { color: #7d9370; }
  .timer-face .time-sub {
    font-size: .68rem;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .now-line {
    margin: 18px auto 0;
    max-width: 32ch;
    text-align: center;
    font-family: var(--serif);
    font-size: clamp(1.02rem, 2.8vw, 1.1rem);
    line-height: 1.7;
    transition: opacity .4s;
  }
  .now-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin-top: 4px;
  }

  /* ---------- footer ---------- */
  .foot {
    margin: 26px 0 0;
    padding: 0 6px;
    text-align: center;
    font-size: .78rem;
    line-height: 1.9;
    color: #a48c82;
  }
  .foot a { color: #9a6a5b; text-decoration: none; border-bottom: 1px solid rgba(154, 106, 91, .35); }
  .foot a:hover { border-bottom-color: currentColor; }
  .foot .sep { opacity: .4; padding: 0 6px; }

  @media (prefers-reduced-motion: reduce) {
    .glow { animation: none; }
    .panel.on { animation: none; }
    .dissolve span { animation-duration: .4s; }
  }
</style>
</head>
<body>

<div class="glow a" aria-hidden="true"></div>
<div class="glow b" aria-hidden="true"></div>

<main class="shell">
  <div class="topbar">
    <button type="button" class="snd" id="sndBtn" aria-pressed="true" aria-label="sonido">
      <svg class="on" viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4z"></path>

  /* ==========  end of the part you edit  ========== */

  var lang = "es";
  try {
    var saved = localStorage.getItem("calm-lang");
    if (saved === "es" || saved === "en") lang = saved;
  } catch (e) {}

  var T = function (key) {
    var pack = STR[lang];
    return pack[key] != null ? pack[key] : STR.en[key];
  };

  /* ---------- sound ---------- */
  var soundOn = true;
  try {
    if (localStorage.getItem("calm-sound") === "off") soundOn = false;
  } catch (e) {}

  var audioCtx = null;
  var sndBtn = document.getElementById("sndBtn");

  function audio() {
    if (!soundOn) return null;
    if (!audioCtx) {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      try { audioCtx = new AC(); } catch (e) { return null; }
    }
    if (audioCtx.state === "suspended") {
      try { audioCtx.resume(); } catch (e) {}
    }
    return audioCtx;
  }

  function tone(freq, to, dur, type, vol, delay) {
    var ctx = audio();
    if (!ctx) return;
    var t0 = ctx.currentTime + (delay || 0);
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || "sine";
    osc.frequency.setValueAtTime(freq, t0);
    if (to) osc.frequency.exponentialRampToValueAtTime(to, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.012);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.04);
  }

  function sndPop() {
    var f = 620 + Math.random() * 280;
    tone(f, f * 0.4, 0.09, "triangle", 0.12);
  }
  function sndDrop() {
    tone(310 + Math.random() * 70, 150, 0.7, "sine", 0.05);
  }
  function sndCatch() {
    var f = 780 + Math.random() * 180;
    tone(f, f, 0.1, "sine", 0.075);
    tone(f * 1.5, f * 1.5, 0.16, "sine", 0.045, 0.035);
  }

  function paintSound() {
    sndBtn.setAttribute("aria-pressed", soundOn ? "true" : "false");
    sndBtn.setAttribute("aria-label", T(soundOn ? "soundOn" : "soundOff"));
  }

  sndBtn.addEventListener("click", function () {
    soundOn = !soundOn;
    try { localStorage.setItem("calm-sound", soundOn ? "on" : "off"); } catch (e) {}
    paintSound();
    if (soundOn) tone(680, 680, 0.1, "sine", 0.08);
  });

  /* ---------- language ---------- */
  var langBtns = document.querySelectorAll(".lang button");
  var ventText = document.getElementById("ventText");
  var breatheBtn = document.getElementById("breatheBtn");
  var phaseEl = document.getElementById("phase");

  function paint() {
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-t]").forEach(function (el) {
      el.textContent = T(el.getAttribute("data-t"));
    });
    ventText.placeholder = lang === "es"
      ? "feo, injusto, lo que sea. nadie lo lee, ni yo."
      : "ugly, unfair, whatever. nobody reads it, not even me.";
    langBtns.forEach(function (b) {
      b.setAttribute("aria-pressed", b.getAttribute("data-lang") === lang ? "true" : "false");
    });
    breatheBtn.textContent = breathing ? T("stop") : T("start");
    if (!breathing) phaseEl.textContent = T("ready");
    paintSound();
    renderTimer();
  }

  langBtns.forEach(function (btn) {
    btn.addEventListener("click", function () {
      lang = btn.getAttribute("data-lang");
      try { localStorage.setItem("calm-lang", lang); } catch (e) {}
      paint();
      if (breathing) { stopBreathe(); }
    });
  });

  /* ---------- tabs ---------- */
  var tabButtons = document.querySelectorAll("#tabs button");
  tabButtons.forEach(function (btn) {
    btn.addEventListener("click", function () {
      tabButtons.forEach(function (b) {
        var on = b === btn;
        b.classList.toggle("on", on);
        b.setAttribute("aria-selected", on ? "true" : "false");
      });
      var target = btn.getAttribute("data-panel");
      document.querySelectorAll(".panel").forEach(function (p) {
        p.classList.toggle("on", p.id === target);
      });
      if (target === "play") showGame(currentGame);
      else stopAllGames();
    });
  });

  /* ---------- breathing ---------- */
  var orb = document.getElementById("orb");
  var orbCount = document.getElementById("orbCount");
  var roundsEl = document.getElementById("rounds");

  var PHASES = [
    { key: "inhale", secs: 4, scale: 1 },
    { key: "hold", secs: 3, scale: 1 },
    { key: "exhale", secs: 7, scale: 0.66 }
  ];

  var breathing = false;
  var phaseIndex = 0;
  var rounds = 0;
  var phaseTimer = null;
  var tickTimer = null;

  function runPhase() {
    if (!breathing) return;
    var p = PHASES[phaseIndex % PHASES.length];
    orb.style.transitionDuration = p.secs + "s";
    orb.style.transform = "scale(" + p.scale + ")";
    phaseEl.textContent = T(p.key);

    var left = p.secs;
    orbCount.textContent = left;
    clearInterval(tickTimer);
    tickTimer = setInterval(function () {
      left -= 1;
      orbCount.textContent = left > 0 ? left : "";
    }, 1000);

    phaseTimer = setTimeout(function () {
      phaseIndex += 1;
      if (phaseIndex % PHASES.length === 0) {
        rounds += 1;
        roundsEl.textContent = rounds;
      }
      runPhase();
    }, p.secs * 1000);
  }

  function startBreathe() {
    breathing = true;
    phaseIndex = 0;
    rounds = 0;
    roundsEl.textContent = "0";
    breatheBtn.textContent = T("stop");
    breatheBtn.classList.add("ghost");
    runPhase();
  }

  function stopBreathe() {
    breathing = false;
    clearTimeout(phaseTimer);
    clearInterval(tickTimer);
    orb.style.transitionDuration = ".9s";
    orb.style.transform = "scale(.66)";
    orbCount.textContent = "";
    phaseEl.textContent = T("ready");
    breatheBtn.textContent = T("start");
    breatheBtn.classList.remove("ghost");
  }

  breatheBtn.addEventListener("click", function () {
    if (breathing) stopBreathe();
    else startBreathe();
  });

  var popNum = document.getElementById("popNum");
  var popDone = document.getElementById("popDone");
  var refill = document.getElementById("refill");
  var popped = 0;

  function buildBubbles() {
    bubbleWrap.innerHTML = "";
    popped = 0;
    popNum.textContent = "0";
    popDone.classList.remove("show");

    var frag = document.createDocumentFragment();
    for (var i = 0; i < TOTAL; i++) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "bubble";
      b.setAttribute("aria-label", "bubble");
      b.addEventListener("pointerdown", popBubble);
      frag.appendChild(b);
    }
    bubbleWrap.appendChild(frag);
    document.getElementById("popTotal").textContent = TOTAL;
  }

  function popBubble(e) {
    var b = e.currentTarget;
    if (b.classList.contains("popped")) return;
    b.classList.add("popped");

    popNum.textContent = popped;
    sndPop();
    if (navigator.vibrate) { try { navigator.vibrate(9); } catch (err) {} }
    if (popped === TOTAL) popDone.classList.add("show");
  }

  /* ---------- vent ---------- */
  var dissolve = document.getElementById("dissolve");

  ventBtn.addEventListener("click", function () {
    var text = ventText.value.trim();
    if (!text) {
      ventText.focus();
      return;
    }

    clearTimeout(ventTimer);
    gone.classList.remove("show");

    var words = text.split(/(\s+)/);
    dissolve.innerHTML = "";
    var visible = 0;
    words.forEach(function (piece) {
      if (!piece) return;
      if (/^\s+$/.test(piece)) {
        dissolve.appendChild(document.createTextNode(" "));
        return;
      }
      var s = document.createElement("span");
      s.textContent = piece;
      s.style.setProperty("--dl", Math.min(visible * 14, 900) + "ms");
      dissolve.appendChild(s);
      visible += 1;
    });

    ventText.classList.add("hidden");
    ventText.value = "";

    ventTimer = setTimeout(function () {
      dissolve.innerHTML = "";
      ventText.classList.remove("hidden");
      gone.classList.add("show");
    }, Math.min(1100 + visible * 14, 2400));
  });

  function stopAllGames() {
    stopRipple();
    stopDraw();
    stopCatch();
    stopConf();

  function showGame(id) {
    currentGame = id;
    gameEls.forEach(function (g) { g.classList.toggle("on", g.id === id); });
    subBtns.forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-game") === id); });
    stopAllGames();
    if (id === "gRipple") { sizeRipple(); runRipple(); }
    else if (id === "gDraw") { sizeDraw(); runDraw(); }
    else if (id === "gCatch") { runCatch(); }
    else if (id === "gConfetti") { sizeConf(); }
    else if (id === "gBlob") { resetBlob(); }
  }

  subBtns.forEach(function (b) {
    b.addEventListener("click", function () { showGame(b.getAttribute("data-game")); });
  });

  /* ---------- game: ripples ---------- */
  var rippleCv = document.getElementById("rippleCv");
  var rctx = rippleCv.getContext("2d");
  var rippleSize = { w: 300, h: 260 };
  var ripples = [];
  var rippleRAF = null;
  var lastDrop = 0;

  function sizeRipple() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var rect = rippleCv.getBoundingClientRect();
    rippleSize.w = rect.width || 300;
    rippleSize.h = rect.height || 260;
    rippleCv.width = Math.round(rippleSize.w * dpr);
    rippleCv.height = Math.round(rippleSize.h * dpr);
    rctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function addRipple(x, y) {
    var now = performance.now();
    var prev = ripples[ripples.length - 1];
    if (prev && now - prev.t < 55 && Math.abs(x - prev.x) + Math.abs(y - prev.y) < 18) return;
    ripples.push({ x: x, y: y, r: 2, a: 1, t: now });
    if (now - lastDrop > 110) { lastDrop = now; sndDrop(); }
  }

  function runRipple() {
    if (rippleRAF) return;
    var step = function () {
      rctx.clearRect(0, 0, rippleSize.w, rippleSize.h);
      for (var i = ripples.length - 1; i >= 0; i--) {
        var p = ripples[i];
        p.r += 2.4;
        p.a -= 0.011;
        if (p.a <= 0) { ripples.splice(i, 1); continue; }
        rctx.beginPath();
        rctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        rctx.strokeStyle = "rgba(226, 154, 122, " + (p.a * 0.6).toFixed(3) + ")";
        rctx.lineWidth = 1.4;
        rctx.stroke();
      }
      rippleRAF = requestAnimationFrame(step);
    };
    rippleRAF = requestAnimationFrame(step);
  }

  function stopRipple() {
    if (rippleRAF) cancelAnimationFrame(rippleRAF);
    rippleRAF = null;
    ripples.length = 0;
    rctx.clearRect(0, 0, rippleSize.w, rippleSize.h);
  }

  function rippleAt(e) {
    var rect = rippleCv.getBoundingClientRect();
    addRipple(e.clientX - rect.left, e.clientY - rect.top);
  }

  rippleCv.addEventListener("pointerdown", function (e) {
    try { rippleCv.setPointerCapture(e.pointerId); } catch (err) {}
    rippleAt(e);
  });
  rippleCv.addEventListener("pointermove", function (e) {
    if (e.buttons || e.pressure > 0) rippleAt(e);
  });

  /* ---------- game: draw ---------- */
  var drawCv = document.getElementById("drawCv");
  var dctx = drawCv.getContext("2d");
  var drawSize = { w: 300, h: 260 };
  var drawRAF = null;
  var drawing = false;
  var lastPt = null;

  function sizeDraw() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var rect = drawCv.getBoundingClientRect();
    drawSize.w = rect.width || 300;
    drawSize.h = rect.height || 260;
    drawCv.width = Math.round(drawSize.w * dpr);
    drawCv.height = Math.round(drawSize.h * dpr);
    dctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    dctx.lineCap = "round";
    dctx.lineJoin = "round";
    dctx.lineWidth = 6;
    dctx.strokeStyle = "rgba(194, 100, 80, 0.5)";
    dctx.fillStyle = "rgba(194, 100, 80, 0.5)";
  }

  function runDraw() {
    if (drawRAF) return;
    var step = function () {
      dctx.fillStyle = "rgba(255, 253, 251, 0.035)";
      dctx.fillRect(0, 0, drawSize.w, drawSize.h);
      drawRAF = requestAnimationFrame(step);
    };
    drawRAF = requestAnimationFrame(step);
  }

  function stopDraw() {
    if (drawRAF) cancelAnimationFrame(drawRAF);
    drawRAF = null;
    drawing = false;
  }

  function drawPoint(e) {
    var rect = drawCv.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  drawCv.addEventListener("pointerdown", function (e) {
    try { drawCv.setPointerCapture(e.pointerId); } catch (err) {}
    drawing = true;
    lastPt = drawPoint(e);
    dctx.beginPath();
    dctx.arc(lastPt.x, lastPt.y, 3, 0, Math.PI * 2);
    dctx.fillStyle = "rgba(194, 100, 80, 0.5)";
    dctx.fill();
  });
  drawCv.addEventListener("pointermove", function (e) {
    if (!drawing || !lastPt) return;
    var p = drawPoint(e);
    dctx.beginPath();
    dctx.moveTo(lastPt.x, lastPt.y);
    dctx.lineTo(p.x, p.y);
    dctx.stroke();
    lastPt = p;
  });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) {
    drawCv.addEventListener(ev, function () { drawing = false; lastPt = null; });
  });

  /* ---------- game: catch the lights ---------- */
  var catchSky = document.getElementById("catchSky");
  var catchNumEl = null;
  var catchTimer = null;
  var caught = 0;

  function spawnLight() {
    if (!catchSky.clientWidth) return;
    var w = catchSky.clientWidth;
    var h = catchSky.clientHeight;
    var size = 26 + Math.random() * 16;

    var el = document.createElement("div");
    el.className = "light";
    el.style.width = size + "px";
    el.style.height = size + "px";
    el.style.marginLeft = (-size / 2) + "px";
    el.style.marginTop = (-size / 2) + "px";
    el.style.left = (size + Math.random() * (w - size * 2)) + "px";
    el.style.top = (h * 0.4 + Math.random() * h * 0.5) + "px";
    el.style.animationDuration = (4.6 + Math.random() * 2.4).toFixed(2) + "s";

    el.addEventListener("animationend", function () { el.remove(); });
    el.addEventListener("pointerdown", function (e) {
      e.stopPropagation();
      caught += 1;
      if (catchNumEl) catchNumEl.textContent = caught;
      sndCatch();
      el.classList.add("caught");
      setTimeout(function () { el.remove(); }, 320);
    });

    catchSky.appendChild(el);
  }

  function runCatch() {
    if (catchTimer) return;
    catchSky.innerHTML = "";
    catchNumEl = document.createElement("span");
    catchNumEl.className = "catch-count";
    catchNumEl.textContent = "0";
    catchSky.appendChild(catchNumEl);
    caught = 0;
    spawnLight();
    catchTimer = setInterval(spawnLight, 850);
  }

  function stopCatch() {
    if (catchTimer) clearInterval(catchTimer);
    catchTimer = null;
    catchSky.innerHTML = "";
    catchNumEl = null;
  }

  window.addEventListener("resize", function () {
    if (currentGame === "gRipple" && rippleRAF) { sizeRipple(); }
    if (currentGame === "gDraw" && drawRAF) { sizeDraw(); }
  });

  /* ---------- game: confetti ---------- */
  var confCv = document.getElementById("confCv");
  var cctx = confCv.getContext("2d");
  var confSize = { w: 300, h: 260 };
  var confParts = [];
  var confRAF = null;
  var lastBurst = 0;
  var CONFETTI_COLORS = ["#e2685a", "#f0a06f", "#f6c96b", "#a8cf9f", "#8fb6d9", "#c79ad6", "#f0929f", "#7fc7bd"];

  function sizeConf() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var rect = confCv.getBoundingClientRect();
    confSize.w = rect.width || 300;
    confSize.h = rect.height || 260;
    confCv.width = Math.round(confSize.w * dpr);
    confCv.height = Math.round(confSize.h * dpr);
    cctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function burstConfetti(x, y) {
    var now = performance.now();
    if (now - lastBurst < 70) return;
    lastBurst = now;

    var n = 22 + Math.floor(Math.random() * 12);
    for (var i = 0; i < n; i++) {
      var ang = Math.random() * Math.PI * 2;
      var speed = 1.3 + Math.random() * 3.8;
      confParts.push({
        x: x,
        y: y,
        vx: Math.cos(ang) * speed,
        vy: Math.sin(ang) * speed - 1.4,
        w: 3 + Math.random() * 5,
        h: 6 + Math.random() * 8,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.34,
        color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
        life: 1
      });
    }
    if (confParts.length > 420) confParts.splice(0, confParts.length - 420);
    sndConfetti();
    runConf();
  }

  function runConf() {
    if (confRAF) return;
    var step = function () {
      cctx.clearRect(0, 0, confSize.w, confSize.h);
      for (var i = confParts.length - 1; i >= 0; i--) {
        var p = confParts[i];
        p.vy += 0.055;
        p.vx *= 0.993;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.life -= 0.005;
        if (p.life <= 0 || p.y > confSize.h + 40) { confParts.splice(i, 1); continue; }
        cctx.save();
        cctx.translate(p.x, p.y);
        cctx.rotate(p.rot);
        cctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.7));
        cctx.fillStyle = p.color;
        cctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        cctx.restore();
      }
      if (!confParts.length) { confRAF = null; cctx.clearRect(0, 0, confSize.w, confSize.h); return; }
      confRAF = requestAnimationFrame(step);
    };
    confRAF = requestAnimationFrame(step);
  }

  function stopConf() {
    if (confRAF) cancelAnimationFrame(confRAF);
    confRAF = null;
    confParts.length = 0;
    cctx.clearRect(0, 0, confSize.w, confSize.h);
  }

  confCv.addEventListener("pointerdown", function (e) {
    try { confCv.setPointerCapture(e.pointerId); } catch (err) {}
    var rect = confCv.getBoundingClientRect();
    burstConfetti(e.clientX - rect.left, e.clientY - rect.top);
  });
  confCv.addEventListener("pointermove", function (e) {
    if (!(e.buttons || e.pressure > 0)) return;
    var rect = confCv.getBoundingClientRect();
    burstConfetti(e.clientX - rect.left, e.clientY - rect.top);
  });

  /* ---------- game: the blob ---------- */
  var blobBox = document.getElementById("blobBox");
  var blob = document.getElementById("blob");
  var heartsBox = document.getElementById("hearts");
  var pupils = document.querySelectorAll("#blob .pupil");
  var pokes = 0;

  function resetBlob() {
    blob.classList.remove("hop");
    heartsBox.innerHTML = "";
    for (var i = 0; i < pupils.length; i++) pupils[i].style.transform = "none";
  }

  function pokeBlob(e) {
    blob.classList.remove("hop");
    void blob.offsetWidth;
    blob.classList.add("hop");
    sndSqueak();
    pokes += 1;

    var rect = blobBox.getBoundingClientRect();
    var x = (e.clientX || rect.width / 2) - rect.left;
    var y = (e.clientY || rect.height / 2) - rect.top;
    var h = document.createElement("span");
    h.className = "heart";
    h.textContent = "\u2665";
    h.style.fontSize = (13 + Math.random() * 7).toFixed(0) + "px";
    h.style.color = pokes % 5 === 0 ? "#e2a184" : "#e2685a";
    h.style.left = Math.max(6, Math.min(rect.width - 22, x)) + "px";
    h.style.top = Math.max(12, y - 8) + "px";
    heartsBox.appendChild(h);
    setTimeout(function () { if (h.parentNode) h.remove(); }, 1250);
  }

  blobBox.addEventListener("pointerdown", pokeBlob);
  blobBox.addEventListener("pointermove", function (e) {
    var r = blob.getBoundingClientRect();
    if (!r.width) return;
    var dx = (e.clientX - (r.left + r.width / 2)) / (r.width / 2);
    var dy = (e.clientY - (r.top + r.height / 2)) / (r.height / 2);
    dx = Math.max(-1, Math.min(1, dx));
    dy = Math.max(-1, Math.min(1, dy));
    for (var i = 0; i < pupils.length; i++) {
      pupils[i].style.transform = "translate(" + (dx * 4).toFixed(1) + "px," + (dy * 4).toFixed(1) + "px)";
    }
  });

  /* ---------- game: sound pads ---------- */
  var PAD_NOTES = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51];
  var PAD_TINTS = ["#f0929f", "#f0a06f", "#f6c96b", "#a8cf9f", "#8fb6d9", "#c79ad6", "#e2685a", "#7fc7bd"];

  document.querySelectorAll("#padGrid .pad").forEach(function (pad, i) {
    pad.style.background = "linear-gradient(160deg, #fff8f2 0%, " + PAD_TINTS[i] + " 100%)";
    pad.addEventListener("pointerdown", function () {
      sndPad(PAD_NOTES[i]);
      pad.classList.remove("lit");
      void pad.offsetWidth;
      pad.classList.add("lit");
    });
  });

  /* ---------- extra sounds ---------- */
  function sndConfetti() {
    tone(380, 880, 0.13, "triangle", 0.045);
  }
  function sndSqueak() {
    tone(540 + Math.random() * 90, 960, 0.13, "sine", 0.07);
  }
  function sndPad(f) {
    tone(f, f, 0.6, "sine", 0.08);
    tone(f * 2, f * 2, 0.4, "sine", 0.028, 0.012);
  }

  /* ---------- cool-down timer ---------- */
  var TOTAL_SECS = 600;
  var RING_C = 2 * Math.PI * 88;
  var timerWrap = document.getElementById("timerWrap");
  var ringFg = document.getElementById("ringFg");
  var timeLeftEl = document.getElementById("timeLeft");
  var timerBtn = document.getElementById("timerBtn");
  var nowLine = document.getElementById("nowLine");

  var leftMs = TOTAL_SECS * 1000;
  var timerRunning = false;
  var startedAt = 0;
  var timerTick = null;

  ringFg.style.strokeDasharray = RING_C.toFixed(1);

  function fmt(sec) {
    var m = Math.floor(sec / 60);
    var s = sec % 60;
    return m + ":" + (s < 10 ? "0" + s : s);
  }

  function renderTimer() {
    var sec = Math.ceil(leftMs / 1000);
    if (sec < 0) sec = 0;
    var finished = sec === 0;

    timeLeftEl.textContent = fmt(sec);
    ringFg.style.strokeDashoffset = (RING_C * (1 - sec / TOTAL_SECS)).toFixed(1);
    timerWrap.classList.toggle("done", finished);
    timerBtn.textContent = T(
      timerRunning ? "tPause" : finished ? "tAgain" : sec === TOTAL_SECS ? "tStart" : "tResume"
    );
    nowLine.textContent = finished ? T("nowDone") : T("nowLine");
  }

  function tick() {
    leftMs = TOTAL_SECS * 1000 - (performance.now() - startedAt);
    if (leftMs <= 0) {
      leftMs = 0;
      timerRunning = false;
      clearInterval(timerTick);
      timerTick = null;
    }
    renderTimer();
  }

  function startTimer() {
    if (leftMs <= 0) leftMs = TOTAL_SECS * 1000;
    startedAt = performance.now() - (TOTAL_SECS * 1000 - leftMs);
    timerRunning = true;
    clearInterval(timerTick);
    timerTick = setInterval(tick, 100);
    renderTimer();
  }

  function pauseTimer() {
    leftMs = TOTAL_SECS * 1000 - (performance.now() - startedAt);
    if (leftMs < 0) leftMs = 0;
    timerRunning = false;
    clearInterval(timerTick);
    timerTick = null;
    renderTimer();
  }

  timerBtn.addEventListener("click", function () {
    if (timerRunning) pauseTimer();
    else startTimer();
  });

  document.getElementById("toBubbles").addEventListener("click", function () {
    var b = document.querySelector('#tabs button[data-panel="play"]');
    if (b) b.click();
    showGame("gPop");
  });

  /* ---------- go ---------- */
  paint();
  buildBubbles();
})();
</script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
</script>
</body>
